<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>InterviewAI</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
        <link rel="stylesheet" href="style.css" />
        <link rel="icon" type="image/jpeg" href="logo.jpg" />
    </head>
    <!--By default body doesn't cover entire height and antialiased is kinda default-->
    <body class="bg-main-back text-main-txt min-h-screen flex flex-col font-txt antialiased">
        <!--Standard Practice since using the entire body will be a issue for browser extensions -->
        <div id="root"></div>
        <!--we need root to exist before loading script.js, type="module" is a strict modern standard for web applications-->
        <script type="module" src="script.js"></script>
    </body>
</html>
